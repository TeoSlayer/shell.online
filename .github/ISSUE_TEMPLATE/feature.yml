name: Focused improvement
description: Make starting, using or sharing a session simpler.
title: "idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not handled well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the outcome and who needs it. Keep the basic no-account sharing flow simple; optional app features are welcome too.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Security and UX tradeoffs
      description: Consider permissions, terminal input, mobile use, process lifetime and any data the feature would store or send elsewhere.
