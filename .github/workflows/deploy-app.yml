name: Deploy app

# The platform under app/ deploys as a Cloudflare Worker with its database on
# Cloud SQL. Two things have to happen in order, and getting them the wrong way
# round is how a deploy breaks: the schema is migrated first, then the Worker
# that expects it goes out.
#
# Migrations only ever add, so a Worker from before a migration still runs
# against the newer schema. That is what makes this order safe and a rollback
# safe with it.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply pending database migrations before deploying
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation, so there is no key to leak.

# One deploy at a time. Two overlapping runs could migrate and deploy in an
# order neither of them intended.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # Fails here, naming what is missing, rather than somewhere further in
      # where the symptom no longer resembles the cause. An unset repository
      # variable is the empty string, and every one of these was empty on the
      # first run of this workflow.
      - name: Check the deploy has what it needs
        env:
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=
          for name in CLOUD_SQL_INSTANCE HYPERDRIVE_ID MAIL_FROM WEB_ORIGIN \
                      FIREBASE_PROJECT_ID VITE_FIREBASE_API_KEY \
                      VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID \
                      CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Not set:$missing" >&2
            echo "Repository variables: CLOUD_SQL_INSTANCE HYPERDRIVE_ID MAIL_FROM WEB_ORIGIN VITE_FIREBASE_*" >&2
            echo "Repository secrets:   CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL" >&2
            exit 1
          fi

      # The Firebase values are compiled into the client, so they are build
      # inputs rather than runtime configuration. They are per-environment and
      # they are not kept in the repository, so they come from here.
      #
      # VITE_ACCOUNTS_URL and VITE_RELAY_URL are deliberately absent: they are
      # plain origins with nothing to protect, app/.env.production holds them,
      # and passing them from an unset variable is what broke this workflow.
      # An unset variable arrives as the empty string, overrides
      # .env.production, and compiles a client that reaches nothing --
      # VITE_RELAY_URL:`` builds cleanly and opens no session. The preflight
      # above and check-bundle.mjs both refuse that now.
      - name: Build the client
        run: npm run build
        working-directory: app
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      - id: gcp
        name: Authenticate to Google Cloud
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The instance has no authorized networks, so it is not reachable from
      # the internet. The proxy connects through Google's own network with the
      # identity above rather than opening a port to let this runner in.
      - name: Open a Cloud SQL connection
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate }}
        run: |
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64"
          echo "e48115261929445f468ae7ae86be199781bafda56837c9f33644892df8d46997  cloud-sql-proxy" \
            | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.CLOUD_SQL_INSTANCE }}" &
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then exit 0; fi
            sleep 1
          done
          echo "the Cloud SQL proxy never started listening" >&2
          exit 1

      - name: Apply migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate }}
        run: npm run db:migrate
        working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Render deployment configuration
        run: npm run render:deploy-config
        working-directory: app
        env:
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}

      # Deployed after the schema it expects is in place.
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy --config wrangler.deploy.jsonc

      - name: Check the deployment answers
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ vars.WEB_ORIGIN }}/api/health" >/dev/null; then
              curl -fsS --max-time 20 "${{ vars.WEB_ORIGIN }}/api/ready"
              exit 0
            fi
            sleep 3
          done
          echo "the deployment never answered a health check" >&2
          exit 1
