<svg xmlns="http://www.w3.org/2000/svg" width="26" height="30" viewBox="0 0 26 30">
  <!--
    The pointer: an arrowhead with a short barb, cut the way a fletcher cuts
    one. The hotspot is its tip, at (3, 2); the rule that says so is in
    game.css, and a cursor whose hotspot is anywhere else is a cursor that
    clicks somewhere other than where it is pointing.

    Brass on dark, so it reads on grass and on a stone panel alike.
  -->
  <path d="M3 2 L3 22 L8.5 17.5 L12 26 L16.5 24 L13 15.5 L20 15 Z"
        fill="#e8b44a" stroke="#241d15" stroke-width="2" stroke-linejoin="round"/>
  <path d="M5 6 L5 17 L8.5 14 Z" fill="#f5e3c0" opacity="0.65"/>
</svg>
