    <title>Chat renderer — preview</title>
    <!--
      A development-only door onto the chat renderer.

      The renderer is normally fed by a live session over an encrypted socket,
      which is a poor thing to develop against: it needs a machine, a password
      and a process that happens to print the case being worked on. This page
      feeds the same renderer a scripted stream of terminal bytes instead, so
      every case it has to get right -- a prompt, a wrapped line, colour, a
      progress bar redrawing in place, a full-screen program, a reconnect --
      can be looked at on demand.

      It is not an input to `vite build`, so it exists while `npm run dev` is
      running and in no deployment. See src/terminal/chat/preview.ts.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/terminal/chat/preview.ts"></script>
  </body>
</html>
